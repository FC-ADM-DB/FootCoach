<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0a1628">
<title>Scores des matchs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* Page publique des scores. Aucune connexion : données via les fonctions Supabase
   public_scores / public_club (équipes « Scores publics » seulement).
   ?club=reh-braives : page du club, à ses couleurs (couleur 2 = bandeau, couleur 1 =
   accent) ; sans paramètre : tous les clubs, thème FootLink neutre.
   (Les noms --red / --yellow viennent du premier thème REH Braives : bandeau / accent.) */
:root{
  --red:#0a1628;--red-dark:#0a1628;--yellow:#00d68f;--yellow-soft:#f2f5fa;
  --ink:#1c1a17;--ink2:#5d5646;--line:#eadf9e;--card:#ffffff;
  --live:#d0172b;--done:#6b665a;--plan:#8a7a00;
  --font:'DM Sans',system-ui,sans-serif;--mono:'DM Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--yellow-soft);color:var(--ink);font-family:var(--font);min-height:100vh;-webkit-text-size-adjust:100%}
header{background:var(--red);color:var(--yellow);padding:18px 16px 16px;border-bottom:5px solid var(--yellow)}
.brand{display:flex;align-items:center;gap:12px;max-width:640px;margin:0 auto}
.crest{width:52px;height:60px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.crest img{max-width:100%;max-height:100%;object-fit:contain}
.brand h1{font-size:24px;font-weight:700;letter-spacing:.02em;line-height:1.05}
.brand p{font-size:13px;color:#ffe9a8;margin-top:3px;font-weight:500}
nav.days{display:flex;align-items:center;gap:8px;max-width:640px;margin:14px auto 0;padding:0 16px}
nav.days button,nav.days input{min-height:44px;border-radius:12px;border:2px solid var(--red);background:#fff;color:var(--red);font-family:var(--font);font-size:15px;font-weight:700}
nav.days button{min-width:44px;padding:0 12px;cursor:pointer}
nav.days input{flex:1;min-width:0;padding:0 10px;text-align:center;color:var(--ink)}
nav.days .today{background:var(--red);color:var(--yellow)}
.day-title{max-width:640px;margin:14px auto 6px;padding:0 16px;font-size:18px;font-weight:700;color:var(--red-dark)}
main{max-width:640px;margin:0 auto;padding:0 16px 32px}
.card{background:var(--card);border-radius:16px;border:1px solid var(--line);border-left:6px solid var(--red);padding:14px 14px 12px;margin-top:12px;box-shadow:0 2px 8px rgba(120,90,0,.08)}
.card-top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.tlogo{width:34px;height:34px;border-radius:9px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:11px;color:#fff;overflow:hidden}
.tlogo img{width:100%;height:100%;object-fit:contain}
.cat{flex:1;min-width:0;font-size:13px;font-weight:600;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{flex-shrink:0;font-size:12px;font-weight:700;padding:5px 10px;border-radius:99px;display:inline-flex;align-items:center;gap:6px}
.pill.live{background:var(--live);color:#fff}
.pill.live::before{content:'';width:7px;height:7px;border-radius:50%;background:#fff;animation:pulse 1.2s ease-in-out infinite}
.pill.done{background:#ecebe6;color:var(--done)}
.pill.plan{background:var(--yellow);color:var(--ink)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.match{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
.side{font-size:16px;font-weight:700;line-height:1.2;overflow-wrap:anywhere}
.side.right{text-align:right}
.side.us{color:var(--red)}
.score{font-family:var(--mono);font-size:34px;font-weight:500;letter-spacing:-.02em;white-space:nowrap;text-align:center}
.score.plan{font-size:20px;color:var(--ink2)}
.meta{margin-top:8px;font-size:13px;color:var(--ink2);display:flex;flex-wrap:wrap;gap:4px 12px}
.meta b{color:var(--ink);font-family:var(--mono);font-weight:500}
.goals{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:13px;line-height:1.6}
.goals span{white-space:nowrap}
.empty{text-align:center;padding:48px 16px;color:var(--ink2)}
.empty .big{font-size:40px;margin-bottom:8px}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
footer{text-align:center;font-size:11px;color:var(--ink2);padding:0 16px 24px}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="crest" id="crest"><span style="font-size:38px">⚽</span></div>
    <div><h1 id="club-nom">FootLink</h1><p>Scores des matchs</p></div>
  </div>
</header>
<nav class="days">
  <button onclick="shiftDay(-1)" aria-label="Jour précédent">◀</button>
  <input type="date" id="day" onchange="setDay(this.value)">
  <button onclick="shiftDay(1)" aria-label="Jour suivant">▶</button>
  <button class="today" onclick="setDay(todayStr())">Aujourd'hui</button>
</nav>
<div class="day-title" id="day-title"></div>
<main id="list"><div class="empty"><div class="big">⚽</div>Chargement…</div></main>
<footer id="foot"></footer>

<script>
// Base Supabase : production, sauf sur le lien de démonstration (branche « demo » sur
// Vercel : foot-coach-git-demo-…) qui utilise la base de test FootLink (données
// fictives). Les deux clés sont des clés PUBLIQUES (la sécurité est dans la base).
const SB_DEMO=/^foot-coach-git-demo-/.test(location.hostname);
const SB_URL=SB_DEMO?'https://shdmzyfdzczhwibwnvdn.supabase.co':'https://oejcfjthamzgnudofcwi.supabase.co';
const SB_KEY=SB_DEMO?'sb_publishable_rXiHRcgsFm6TwzFapFckQA_shM52ilJ':'sb_publishable_nhiVzYaIgNOqYkWyjsz7CQ_pkYNMYBx';
let day=null,rows=[],refreshIv=null;
// Club demandé dans l'adresse (identifiant court, ex. reh-braives) ; null = tous les clubs
const CLUB=(new URLSearchParams(location.search).get('club')||'').toLowerCase().replace(/[^a-z0-9-]/g,'')||null;
const rpc=(fn,body)=>fetch(`${SB_URL}/rest/v1/rpc/${fn}`,{method:'POST',headers:{apikey:SB_KEY,Authorization:`Bearer ${SB_KEY}`,'Content-Type':'application/json'},body:JSON.stringify(body)});
const okColor=c=>/^#[0-9a-fA-F]{6}$/.test(c||'')?c:null;
// Habillage aux couleurs du club (nom, logo, bandeau, accent)
async function loadClub(){
  if(!CLUB)return;
  try{
    const r=await rpc('public_club',{p_slug:CLUB});const c=(await r.json())[0];
    if(!c)return;
    document.getElementById('club-nom').textContent=c.nom.toUpperCase();
    document.title='Scores — '+c.nom;
    const l=safeLogo(c.logo);if(l)document.getElementById('crest').innerHTML=`<img src="${l}" alt="">`;
    const c1=okColor(c.couleur1),c2=okColor(c.couleur2)||c1;
    const root=document.documentElement.style;
    if(c2){root.setProperty('--red',c2);root.setProperty('--red-dark',c2);document.querySelector('meta[name=theme-color]').content=c2;}
    if(c1){root.setProperty('--yellow',c1);root.setProperty('--yellow-soft',`color-mix(in srgb, ${c1} 16%, white)`);}
  }catch(e){}
}

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeLogo=l=>typeof l==='string'&&/^data:image\/(png|jpeg|webp);base64,[A-Za-z0-9+/=]+$/.test(l)?l:null;
const pad=n=>String(n).padStart(2,'0');
const fmt=s=>pad(Math.floor(s/60))+':'+pad(s%60);
function todayStr(){const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;}
function parseDay(s){const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);}

function setDay(s){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(s||''))s=todayStr();
  day=s;document.getElementById('day').value=s;
  const t=parseDay(s).toLocaleDateString('fr-BE',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  document.getElementById('day-title').textContent=(s===todayStr()?"Aujourd'hui — ":'')+t.charAt(0).toUpperCase()+t.slice(1);
  // Date dans l'adresse : un lien partagé (…/scores.html?date=2026-10-24) ouvre ce jour-là.
  const u=new URL(location.href);if(s===todayStr())u.searchParams.delete('date');else u.searchParams.set('date',s);
  history.replaceState(null,'',u);
  load();
  clearInterval(refreshIv);
  // Rafraîchit automatiquement le jour actuel (matchs en direct) toutes les 20 s.
  if(s===todayStr())refreshIv=setInterval(load,20000);
}
function shiftDay(n){const d=parseDay(day);d.setDate(d.getDate()+n);setDay(`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`);}

async function load(){
  const asked=day;
  try{
    const r=await rpc('public_scores',CLUB?{d:asked,p_club:CLUB}:{d:asked});
    if(!r.ok)throw new Error(r.status);
    const data=await r.json();
    if(asked!==day)return; // l'utilisateur a changé de jour entre-temps
    rows=Array.isArray(data)?data:[];
    render();
    document.getElementById('foot').textContent='Mis à jour à '+new Date().toLocaleTimeString('fr-BE',{hour:'2-digit',minute:'2-digit'});
  }catch(e){
    if(!rows.length)document.getElementById('list').innerHTML=`<div class="empty"><div class="big">📡</div><b>Scores indisponibles</b>Vérifie ta connexion, nouvel essai automatique.</div>`;
  }
}

function liveSecs(m){return m.chrono_on&&m.chrono_started_at?Math.max(0,Math.floor((Date.now()-Number(m.chrono_started_at))/1000)):(m.chrono_s||0);}
function goalMinute(g,m){const dur=m.duree_mt||30;return (g.mt===2?dur:0)+Math.floor((g.t||0)/60)+1;}

function render(){
  const el=document.getElementById('list');
  if(!rows.length){el.innerHTML=`<div class="empty"><div class="big">📅</div><b>Aucun match ce jour-là</b>Utilise ◀ ▶ ou le calendrier pour changer de jour.</div>`;return;}
  el.innerHTML=rows.map(m=>{
    const l=safeLogo(m.logo);
    const home=m.lieu!=='exterieur'; // équipe à gauche à domicile, à droite à l'extérieur
    const us=`<div class="side us${home?'':' right'}">${esc(m.equipe)}</div>`;
    const them=`<div class="side${home?' right':''}">${esc(m.adversaire)}</div>`;
    const heure=new Date(m.date_match).toLocaleTimeString('fr-BE',{hour:'2-digit',minute:'2-digit'});
    let pill,score,meta;
    if(m.statut==='en_cours'){
      pill=`<span class="pill live">EN DIRECT</span>`;
      score=home?`${m.score_nous} – ${m.score_eux}`:`${m.score_eux} – ${m.score_nous}`;
      meta=`<span>${m.mi_temps===2?'2e':'1re'} mi-temps</span><span>⏱ <b data-live="${esc(m.match_id)}">${fmt(liveSecs(m))}</b>${m.chrono_on?'':' (pause)'}</span>`;
    } else if(m.statut==='termine'){
      pill=`<span class="pill done">Terminé</span>`;
      score=home?`${m.score_nous} – ${m.score_eux}`:`${m.score_eux} – ${m.score_nous}`;
      meta=`<span>Coup d'envoi ${heure}</span>`;
    } else {
      pill=`<span class="pill plan">À venir</span>`;
      score=heure;
      meta='';
    }
    meta+=`<span>${m.lieu==='exterieur'?'✈️ Extérieur':'🏠 Domicile'}</span>`;
    // Nos buts : « 12' Prénom N. » si la publication est autorisée, sinon « 12' » seul.
    const buts=(m.buts||[]).filter(g=>!g.adv);
    const goals=buts.length?`<div class="goals">⚽ ${buts.map(g=>`<span>${goalMinute(g,m)}'${g.buteur?' '+esc(g.buteur):''}</span>`).join(' · ')}</div>`:'';
    return `<article class="card">
      <div class="card-top">
        <div class="tlogo" style="background:${l?'transparent':esc(m.couleur||'#b0212f')}">${l?`<img src="${l}" alt="">`:esc(m.categorie||'')}</div>
        <div class="cat">${esc(CLUB||!m.club_nom?(m.categorie||''):m.club_nom+' · '+(m.categorie||''))}</div>${pill}
      </div>
      <div class="match">${home?us:them}<div class="score${m.statut==='prevu'?' plan':''}">${score}</div>${home?them:us}</div>
      <div class="meta">${meta}</div>${goals}
    </article>`;
  }).join('');
}
// Chrono des matchs en direct : avance chaque seconde entre deux rafraîchissements.
setInterval(()=>{document.querySelectorAll('[data-live]').forEach(b=>{const m=rows.find(r=>r.match_id===b.dataset.live);if(m&&m.chrono_on)b.textContent=fmt(liveSecs(m));});},1000);

loadClub();
setDay(new URLSearchParams(location.search).get('date'));
</script>
</body>
</html>
